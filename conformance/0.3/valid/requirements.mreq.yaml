format: "mundanereq-yaml-0.3"
# File-level author comment. It is not part of the requirement model.
# A comment may precede a requirement.
# A comment may occur between complete scalar fields.
# A comment may precede a prose field, but not its body.
# The preceding prose body is complete here.
# A comment may precede a relationship.
# A comment may follow a requirement.
# A comment line by itself separates adjacent records.
# Math and prose content are complete before this comment.
# Comments may occur between relationship values.
# Blank and comment lines may be combined between records.
# A trailing comment is permitted after the final record.
requirements:
  - id: "CHILD"
    title: "Derived child behavior"
    allocation: "Subsystem"
    statement:
      - prose: "The subsystem shall provide the behavior allocated by the parent requirement."
    rationale:
      - "The child identifies a separately reviewable implementation responsibility."
    decomposes:
      - "TOP"
  - id: "LEAF"
    title: "Leaf timing behavior"
    statement:
      - prose: "The component shall complete the behavior within the interval defined by:"
      - math:
          language: "latex"
          payload: "t_{complete} - t_{start} \\le 100\\,\\mathrm{ms}"
      - prose: "The interval uses a monotonic time source."
    source: "TEST-SOURCE, revision A, section 4.2"
    decomposes:
      - "CHILD"
      - "TOP"
  - id: "TOP"
    title: "Top-level behavior"
    allocation: "System"
    statement:
      - prose: "The system shall provide the required externally observable behavior."
      - prose: "The behavior shall remain available throughout normal operation."
    rationale:
      - "The top-level requirement defines the user-visible outcome independently of implementation."
    source: "TEST-SOURCE, revision A, section 4"
