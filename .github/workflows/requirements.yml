name: Requirements source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Immutable migration replay reads the recorded ancestor.

      - name: Install GraalVM Community Edition 21
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install full verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby python3-venv curl gcc make libc6-dev zlib1g-dev binutils

      - name: Run authoritative verification and failure propagation checks
        run: scripts/run-ci-verification.sh
