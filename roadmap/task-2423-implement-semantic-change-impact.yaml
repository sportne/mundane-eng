  ## Question

  Can an engineer obtain reproducible explanations from a changed artifact to stale
  evidence, analysis and readiness decisions?

  ## Outcome

  Implement Cross-Domain Change and Staleness Queries. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Extend impact through approved compiled domain adapters and add revision-aware
  comparison/assessment invalidation. Populate changes to software, hardware, assumptions
  and procedures in the reference project; preserve deterministic explanations and source
  links.

  ## Acceptance evidence

  Execute the design matrix and compare expected affected obligations, analyses and review
  states. Queries explain changed input through derived result to release readiness.
  Missing unsupported domains remain visible; legacy supported impact fixtures keep their
  declared behavior. Record commands or review steps, input revisions, observed results
  and remaining limitations in repository evidence linked from this card.

  ## Out of scope

  A shared source parser dependency across domain consumers.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

