  ## Problem and outcome

  Development-host tests do not prove installation from the delivered package. Install the packaged VSIX in an isolated VS Code profile, use the extracted bridge and a clean example workspace, and exercise configuration failure/recovery.

  ## Scope and acceptance

  Installed-path checks prove diagnostics, navigation, formatting, completion and hover; missing bridge/bad selection/mismatched protocol recover after correction; full gate passes.

  ## Evidence

  Record actual owning checks and changed artifacts before completion. Use repository
  examples and repeatable local tests; do not infer hosted or cross-platform results.

  ## Dependencies and boundaries

  Predecessor decisions establish the contracts used here. Tasks 1902 and 1903
  unlock packaging, which unlocks installed-package checks. Human-authored YAML
  and IDs remain authoritative. No new artifact language, Marketplace publication,
  release milestone or unsupported platform promise is included.

  ## Compatibility, risks and stop conditions

  Preserve requirement source and compiled semantics. Keep wire compatibility explicit.
  Stop or revise if measurements do not justify an optimization, cached results can
  become stale, or a package needs unverified platform assumptions. Components are
  editor code/tests, version generation, Makefile, distribution and planning guides.

