  ## Question

  Does the complete reference workflow behave correctly under every planned fault, change
  and missing-evidence scenario?

  ## Outcome

  Exercise the Complete GCS Engineering Workflow. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Run every scenario in the plan against the simulator fixture and tabletop operational
  records. Exercise the full edit, compile, assess, review and change loop including
  combined failures and intentionally incomplete evidence. Record observations, gaps and
  reproducible failure mutations.

  ## Acceptance evidence

  A clean-checkout scenario ledger names commands, inputs, expected states, actual results
  and retained evidence for every scenario. Positive and negative results agree across
  CLI, editor and reports. No real flight or hardware qualification is implied by
  simulation. Split newly discovered gaps into concrete cards before claiming completion.
  Record commands or review steps, input revisions, observed results and remaining
  limitations in repository evidence linked from this card.

  ## Out of scope

  Using a polished happy-path demo as proof of engineering completeness.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

