body: |
  ## Outcome
  
  Define the YAML source contracts for attribute declarations and verification plans before implementation.
  
  ## Work
  
  Specify a shared bounded YAML presentation policy, declaration source identifier, plan structure and source locations. Keep compiled JSON interfaces and existing engineering semantics. Remove JSON declaration and TSV plan source support, with no permanent adapters.
  
  ## Acceptance evidence
  
  Review contracts against existing requirement/work YAML rules; identify exact source and tool version changes.
  
  ## Compatibility and affected components
  
  Breaking experimental authoring change authorized by the user. Compiled JSON and JSON import/editor/work manifests remain supported. Source parsers, specs, examples, tests, editor and distribution change where affected.
  
  ## Completion decision
  
  Complete only after the owning checks pass and replaced source representations are removed.
  
  ## References
  
  - [Roadmap](../0001-initial-roadmap.md)

  ## Executed evidence

  Reviewed shared presentation and domain scalar rules against existing YAML requirements and work items. Specification 0027 defines source identifiers, decoded output compatibility, bounded parsing, accurate locations and required failure checks before implementation.
