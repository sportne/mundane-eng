  ## Question

  How should selected parts, installed instances and connections own their facts while
  producing consistent BOM and wiring views?

  ## Outcome

  Design Equipment Parts and Wiring Artifacts. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Define part definitions, selected equipment, instances, quantities, manufacturer
  evidence and substitution decisions. Model purchased server, UPS, switch and link
  adapter ports, cables, pins where needed, protection and grounding assumptions. Choose a
  canonical connectivity source and boundaries for native CAD imports. Publish draft
  examples and the representation/interaction decision before dependent implementation. If
  the worked case reveals unrelated contracts, split the card before implementation and
  preserve this decision trail.

  ## Acceptance evidence

  Illustrative equipment and connectivity YAML generate a legible wiring view and BOM
  without duplicating connection facts. Show incompatible voltage/connector selection,
  disconnected protection and a substituted part with stale supporting datasheet.
  Illustrative values cannot be mistaken for approved procurement data. Record commands or
  review steps, input revisions, observed results and remaining limitations in repository
  evidence linked from this card.

  ## Out of scope

  PCB layout, detailed mechanical CAD or asserting electrical safety from connectivity
  alone.

  ## Compatibility and affected components

  This is a design task: proposed YAML and compiled contracts are non-normative until
  implemented. Follow existing human-ID, explicit-import and independently versioned
  component conventions. Human-authored engineering facts use YAML; native code, CAD,
  build and result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Accept the representation and interaction design only when its positive and failure
  examples resolve the stated question. Keep unsupported behavior and unresolved
  engineering judgments explicit. Revise or split scope if it needs an unapproved domain
  model; do not fill gaps with successful-looking fixture values.

