  ## Executed evidence

  Completed 2026-09-07. The [equipment decision](../../examples/ground-control-station/design/equipment.md), closed draft schema and illustrative YAML define parts, installed/design instances, exact datasheet evidence, ratings, ports/pins, cables, substitutions and assumptions. BOM and wiring have one canonical connectivity source. Native CAD remains a future explicit adapter; procurement and electrical safety are not inferred.

  Ran the independent `check-equipment.py` design probe: PASS source schema and one-source BOM/wiring generation, incompatible voltage and connector rejection, missing protection route detection and stale supporting evidence after an illustrative substitution. The derived review is `build/gcs-design/equipment.md`. The implementation's additional pin, grounding, duplicate-feed and source-navigation checks are explicitly specified. `equipment-design-verify` is part of the full gate.
