  ## Outcome

  Show attribute descriptions, types, allowed values and requiredness on hover.

  ## Work and acceptance evidence

  Use current declaration data and source context, escape untrusted Markdown, and avoid stale or unrelated hover results. Document the complete extension, run integrated Extension Host and authoritative checks, and record evidence.

  ## Compatibility and boundaries

  Human-authored source remains authoritative. Requirements and other artifact
  languages keep independent contracts. No work-item authoring integration, remote
  publishing, automated approval or general language-server framework is included.
  Each implemented behavior needs reproducible tests and contributor documentation.

  ## Completion decision

  Stop or revise if the feature requires hidden project discovery, a competing
  semantic validator, stale edits, unsupported source inference or unbounded input.
  The predecessor's contract must resolve dependent implementation choices first.

  ## References

  - [Roadmap](../0001-initial-roadmap.md)
  - [Source rules](../../specification/0010-requirements-yaml-0.3.md)

  ## Completion evidence

  Actual VS Code hover tests passed for parsed ranges, requiredness/types/enum values, unsaved declaration documentation rendered literally, invalid declaration clearing and prose exclusion. The complete scripts/run-ci-verification.sh wrapper passed with all editor checks integrated into make verify; both injected failures were rejected and restored. vsce rebuilt the local VSIX and its inventory/link destinations were checked. See research/0070-vscode-editor-verification.md for recorded local evidence and limits.
