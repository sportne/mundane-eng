  ## Outcome

  Apply conservative formatting as reviewable VS Code edits.

  ## Work and acceptance evidence

  Validate the complete current project snapshot before edits; preserve comments, quotes and opaque values. Respect cancellation and document versions. Verify invalid input, CRLF normalization, idempotence and no direct filesystem writes.

  ## Compatibility and boundaries

  Human-authored source remains authoritative. Requirements and other artifact
  languages keep independent contracts. No work-item authoring integration, remote
  publishing, automated approval or general language-server framework is included.
  Each implemented behavior needs reproducible tests and contributor documentation.

  ## Completion decision

  Stop or revise if the feature requires hidden project discovery, a competing
  semantic validator, stale edits, unsupported source inference or unbounded input.
  The predecessor's contract must resolve dependent implementation choices first.

  ## References

  - [Roadmap](../0001-initial-roadmap.md)
  - [Source rules](../../specification/0010-requirements-yaml-0.3.md)

  ## Completion evidence

  Actual VS Code formatting-provider tests passed: an invalid surrounding project blocks edits, a valid CRLF buffer receives editor-managed LF edits, exact text is preserved, a second format returns no edits, and source files remain unsaved. Maintained Java tests and the native bridge build passed. Provider freshness checks reject overtaken document versions.
