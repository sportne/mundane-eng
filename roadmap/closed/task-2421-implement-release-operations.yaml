  ## Executed evidence


    ## Executed evidence (2026-09-07)

    Implemented independently versioned operations-model and source/CLI components,
    [contract](../../specification/0036-release-and-operational-traceability.md),
    [commands](../../distribution/operations.md), closed schema, candidate query and
    revision-linked report. The model consumes compiled assurance/evidence/software,
    exact configurations and existing WorkArtifact validation, with no YAML or work
    source reader dependency. Native backup bytes remain opaque, pinned resources.

    scripts/check-operations-workflow.py rebuilds ten explicit GCS executions: startup,
    backup, failed upgrade, rollback, restore, queued-command restart, handover,
    like-for-like server replacement, anomaly and corrected startup. It retains four
    candidates. RC-UPGRADE and RC-REPLACEMENT remain blocked by recorded failures;
    RC-INITIAL and RC-CORRECTED demonstrate local readiness using the explicit
    synthetic assurance waiver. INC-QUEUE closes through GCS-RESTART, the completed
    existing-format GCS-CORRECT-QUEUE work item and an actual distinct corrected-session
    simulator run in a descendant candidate. Original failure records remain visible.

    Native adversarial checks cover selected/observed build mismatch, missing evidence,
    configuration drift, unknown preconditions, absent operator actions, pending
    acceptance, open incident, reused run, invalid descendant, incomplete work, unknown
    rollback compatibility, missing backup, cycles, unordered history, expired review,
    future execution and unwaived assurance. Native pin tamper/missing resources,
    deterministic reconstruction, query selection and YAML-free JVM consumers passed.
    An invalid resolution candidate is blocked explicitly even when its predecessor
    was changed to escape the affected candidate's descendant chain.

    Repeated unchanged native resources now share captured snapshots and aggregate
    byte accounting, while every read checks current bytes and every invocation
    retains final mutation detection. The first fresh gate exposed stale-source-link
    behavior in an initial caching implementation; this was fixed and covered by
    repeated-read, per-reader-size and mutation tests before the full rerun.

    Ran scripts/run-ci-verification.sh from a fresh checkout containing the staged
    batch sources and no copied build outputs: all 23 maintained groups, ownership
    and forbidden-dependency probes, independent schemas, native packages, development
    and installed editor hosts, all GCS domain workflows and both authoritative CI
    failure injections passed. The wrapper exited 0 and injected source changes were
    restored exactly. Logs are retained locally under
    build/ci-evidence/gcs-assurance-operations. Final card/index metadata checks passed
    after closure. Each of TC-2418 through TC-2421 has its own commit.

    This is an offline synthetic tabletop and bounded simulator, not actual deployment,
    physical replacement, field repair or authenticated operator logging. Authored
    acceptance remains separate from observed evidence. DSSE identity assurance is
    scoped to caller-selected public keys; organizational authority and engineering
    adequacy are external. All release reports retain authorization none.
