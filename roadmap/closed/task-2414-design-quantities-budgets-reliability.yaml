  ## Executed evidence

  Completed 2026-09-07. The [budget decision](../../examples/ground-control-station/design/budget.md), closed draft schema and illustrative YAML define bounded quantities, evidence/basis, selected ratings, uncertainty intervals, formula evaluation, applicability, margins and conditional availability. Power, UPS usable energy/runtime, network/latency, compute fractions and storage have explicit worked cases. A shared power cause is included once; independence assumptions and unavailable judgments remain explicit.

  Ran `check-budget.py`: PASS independent Decimal/dimensional reference calculations (90 W, 86.4 Wh, 0.96 h, 15 Mbps, 7.2 GB), omitted peak identification, incompatible dimensions, failed margins after a 200 W host substitution and sensitivity to shared-power repair time. Reference results are under `build/gcs-design/budget-reference.json`; the check is included in `make verify`. The compiled implementation must additionally exercise interval uncertainty, cyclic/missing inputs, provenance/staleness and parser removal. No certified hardware or numerical safety claim is made.
