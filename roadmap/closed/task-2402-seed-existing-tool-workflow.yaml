  ## Question

  How far can the current requirements, plan, work and impact tools take the reference
  station, and where do engineers need manual records?

  ## Outcome

  Build the GCS Seed with Existing Artifact Tools. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Create runnable requirements, project attribute declarations, verification plan and
  engineering work items using existing YAML contracts. Use existing explicit compiled
  imports and source mappings. Describe startup, stale telemetry and power/link loss,
  keeping unsupported records as clearly labelled design sketches. Add a single documented
  command for compile, link, coverage, impact and report generation.

  ## Acceptance evidence

  A clean checkout reproduces the seed reports using current maintained tools. Demonstrate
  a missing requirement reference, an uncovered requirement and a changed requirement
  requiring review. A limitations inventory distinguishes coverage from execution and
  lists every manual engineering step. Record commands or review steps, input revisions,
  observed results and remaining limitations in repository evidence linked from this card.

  ## Out of scope

  Adding new artifact kinds or implying a coverage report establishes satisfaction.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

