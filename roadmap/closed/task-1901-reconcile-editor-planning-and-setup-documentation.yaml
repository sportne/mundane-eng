  - [Roadmap](../0001-initial-roadmap.md)
  - [Editor contract](../../specification/0024-vscode-editor-0.1.md)

  ## Completion evidence

  Removed completed editor candidates from future work, replaced orphaned conditional-card references without changing their conditions, and consolidated the full prerequisite list in the build guide. The planning checker now validates bare task citations as well as Markdown links. Source-card/index rebuild and documentation checks passed.
