  ## Executed evidence

  Completed 2026-09-07. Implemented `mundane-software compile/check/analyze/query/view` with independent SLSA and CycloneDX adapters, YAML project relationships, source-linked reports and exact configuration/native resource/review checks. The [contract](../../specification/0032-software-provenance-and-security.md) and [guide](../../distribution/software.md) define the consumed standards projection and authentication limits. No custom replacement SBOM, VEX or provenance record was introduced. The deterministic fixture archive is actually built from source; advisory and reviewer data remain synthetic.

  Focused Java adapter tests and the native software workflow passed. The native workflow covers a real SLSA/BOM/binary correspondence, advisory to synthetic deployed baseline and safety-control chain, no/failed/empty scan distinctions, stale review pins, changed dependency/invalid version/missing source rejection, raw-resource tampering/absence, identical clean-root rebuild and a consumer classpath with YAML removed. Compilation pins the same configuration for software and referenced safety controls. Version-resource and predecessor pins and the synthetic manual observation were explicitly updated for the new producer declarations; verification never auto-repairs these authored pins.

  The design and native checks are included in `make verify`. Full batch verification will additionally exercise the combined platform after the equipment and calculation cards are implemented. Live scanning, signature verification, release authorization and further native formats remain explicitly unsupported.
