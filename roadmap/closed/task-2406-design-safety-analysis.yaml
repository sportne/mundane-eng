  ## Executed evidence

  Completed on 2026-09-07. Accepted the worked safety YAML schema, ownership and
  interaction decision in examples/ground-control-station/design/safety.md. Two
  hazards link three controls to actual selected requirements and verification
  activities. The bounded host-power FMEA and qualitative fault tree preserve the
  shared POWER-DOMAIN cause, explicit unverified assumptions and owned unresolved risk.
  No numerical probability/risk scoring or automatic acceptance field is admitted.

  The independent design checker validated the schema and actual imported identities,
  configuration and architecture pins, then passed ten coverage/reference/change cases,
  including missing control, broken cause, unsupported probability, stale review,
  wrong kind, fault-tree cycle and explicit residual-risk visibility. Reproducible
  commands and evidence paths are documented in the design guide and make target.
  TC-2407 owns maintained source/compiled contracts and command implementation.
