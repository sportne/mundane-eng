  ## Problem and outcome

  Provider calls and unrelated edits currently invalidate all selected projects. Record a reproducible request-count baseline, then scope invalidation and reuse unchanged results with bounded caches.

  ## Scope and acceptance

  Measured request counts decrease for repeated providers and unrelated edits; changed schemas/files still invalidate; simultaneous folders, cancellation and stale results have behavioral tests.

  ## Evidence

  Record actual owning checks and changed artifacts before completion. Use repository
  examples and repeatable local tests; do not infer hosted or cross-platform results.

  ## Dependencies and boundaries

  Predecessor decisions establish the contracts used here. Tasks 1902 and 1903
  unlock packaging, which unlocks installed-package checks. Human-authored YAML
  and IDs remain authoritative. No new artifact language, Marketplace publication,
  release milestone or unsupported platform promise is included.

  ## Compatibility, risks and stop conditions

  Preserve requirement source and compiled semantics. Keep wire compatibility explicit.
  Stop or revise if measurements do not justify an optimization, cached results can
  become stale, or a package needs unverified platform assumptions. Components are
  editor code/tests, version generation, Makefile, distribution and planning guides.

  ## References

  - [Roadmap](../0001-initial-roadmap.md)
  - [Editor contract](../../specification/0024-vscode-editor-0.1.md)

  ## Completion evidence

  The actual two-folder Extension Host scenario measured repeated-query launches falling from 12 to 1, unrelated-edit launches from 2 to 0, and both concurrent folders returning results instead of only one. The scenario is now in make verify. Six Node tests cover bounded request sharing, invalidation and late results; existing actual editor provider/unsaved-schema tests passed. research/0071-editor-request-traffic.md records the bounded evidence.
