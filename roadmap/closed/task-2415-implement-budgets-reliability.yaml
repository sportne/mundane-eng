  ## Executed evidence

  Completed 2026-09-07. Implemented independently built `mundane-budget compile/check/calculate/analyze/view/compare`, the [published contract](../../specification/0034-budgets-and-reliability.md) and [usage guide](../../distribution/budget.md). Dimensional interval arithmetic uses directed decimal rounding, bounded formula graphs, explicit units and evidence bases. It detects missing PEAK coverage, incompatible dimensions, cycles, absent inputs, zero-containing divisors, reversed bounds and unsupported evidence claims. Fractions explicitly stay within zero and one. Selected rating values/bases and equipment/configuration revisions are checked; downstream equipment findings propagate. Reliability remains conditional on explicit independence and shared-power assumptions, with unknown independence yielding unavailable output.

  Focused JVM and native checks passed against independent Decimal references: 90 W peak, 86.4 Wh usable energy, 0.96 h runtime, 15 Mbps network and 7.2 GB storage. Native cases include seven rejected models, interval indeterminacy, kW/W conversion, missing peak coverage, repair-time sensitivity, a 200 W host substitution that fails power/runtime margins, stale equipment reviews and old calculation invalidation after changing an assumption. Clean-root rebuilds and YAML-free consumers passed. Integration review also added instance-to-baseline/datasheet navigation to equipment reports and explicit native-resource/scanner identities to software reports; unscoped advisories are rejected.

  Ran `scripts/run-ci-verification.sh` from an exported staged-source checkout with no copied build outputs. The wrapper exited 0: all 21 maintained Java groups, actual component/source isolation, independent schemas, prior native/golden/mutation workflows, native packages, nine Node tests, real development and installed VS Code hosts, every GCS native workflow and both deliberate CI failures passed. Invalid example input and an omitted schema target failed at the expected gate targets and were restored byte-for-byte. `git diff --exit-code` confirmed restored fresh inputs and no changes from the tested staged source in the working checkout. The complete log is retained locally at `build/ci-evidence/provenance-hardware/fresh-verify.log` with environment and failure-propagation evidence. Verified native tools were copied back for local inspection; final metadata/index checks cover card closure.

  This completes the six-card provenance/security and hardware-foundation batch. Industry standard SLSA/in-toto and CycloneDX retain native ownership; project facts remain YAML. All reference equipment, vulnerability, review and availability evidence is explicitly synthetic or conditional. No signature validation, live scanner, numerical safety approval, physical installation or release authorization is claimed. Assurance/release, broader semantic impact, editor/review integration and packaging remain their existing cards.
