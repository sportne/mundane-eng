  ## Question

  The existing tools link individual artifact domains but cannot explain a selected
  cross-artifact change's potential review consequences.

  ## Outcome

  Prove a repeatable requirements-to-verification-to-task review workflow and explain its practical limits.

  ## Work

  Check in a realistic example, golden results, seeded graph properties and targeted behavioral mutations. Integrate public JVM/native workflow checks into make verify and document commands and limitations.

  ## Acceptance evidence

  The example reproduces expected downstream activities and tasks, retains human IDs and authored status, and demonstrates excluded links and scope separation. The authoritative verification command passes; evidence records actual checks.

  ## Out of scope

  New source languages, automatic status changes, approval or satisfaction claims,
  source diffs, resource/code-symbol analysis and a universal metamodel.

  ## Compatibility and affected components

  Existing source and compiled contracts remain unchanged. A separate experimental
  impact contract owns integration and output. Likely components are serialized domain
  validation, a new impact consumer, version declarations, CLI tests and documentation.
  Human-authored IDs retain identity; SHA-256 records selected exact revisions only.

  ## Completion decision

  Proceed only when the predecessor contract resolves scope and traversal meaning.
  Stop or revise if a relationship needs inferred domain facts, silently merged
  revisions, unbounded traversal or an unsupported claim about correctness. Each card
  supplies evidence for its own outcome before dependent work starts.

  ## References

  - [Roadmap](../0001-initial-roadmap.md)
  - [Task workflow](../0002-task-card-index.md)

  ## Completion evidence

  The [completion record](../../research/0069-impact-workflow-verification.md) documents the checked-in logger workflow, six expected review candidates, exact goldens, 16 seeded cyclic graphs, four killed behavioral mutations, parser-free JVM/native consumption, unchanged source/status and source-linked reports. scripts/run-ci-verification.sh passed with exit 0, including the authoritative gate and both failure injections. Final backlog/migration, documentation and diff checks passed. TC-1701–1705 are complete without changing artifact source languages or treating generated output as authoritative.
