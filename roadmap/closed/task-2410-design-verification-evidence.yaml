  ## Executed evidence

  Completed on 2026-09-07. Accepted procedure/run/manual-observation/assessment
  schemas and ownership/interaction rules in design/procedure.md, with authored
  stale-telemetry, combined mains/link-loss and synthetic inspection procedures.
  The bounded timing model records milliseconds, clock provenance and uncertainty;
  source/build/config/procedure pins and raw evidence remain independently identified.
  Reviewer assessments remain separate from observations and do not establish approval.

  The independent checker passed the three worked procedures, four closed schema
  self-checks and nine result/timing interpretations: pass, fail, missing observation,
  skipped, interrupted, incompatible clock, late observation, conflicting runs and
  synthetic manual inspection. Reproducible evidence is under build/gcs-design.
  These are design tests, not claims of actual execution. TC-2411 must implement the
  adapters and demonstrate actual simulator faults, exact provenance and tamper checks.
