  ## Question

  How should procedures, observations, execution provenance and assessed results remain
  distinct and traceable?

  ## Outcome

  Design Procedures Execution Results and Evidence. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Distinguish verification activity, reproducible procedure/test case, execution run,
  observation/evidence and assessed result. Define inputs, expected outcomes,
  environments, tolerances, clock provenance, code/build/config/procedure revisions and
  resource digests. Specify automated and manual result adapters and unavailable evidence
  handling. Publish draft examples and the representation/interaction decision before
  dependent implementation. If the worked case reveals unrelated contracts, split the card
  before implementation and preserve this decision trail.

  ## Acceptance evidence

  Worked YAML procedures cover stale telemetry and combined mains/link loss with time-
  bounded expected observations. Model pass, fail, inconclusive, skipped, interrupted,
  conflicting repeated runs and manual inspection. A successful command acknowledgement
  cannot alone establish safe execution; stale/missing evidence cannot count as current
  support. Record commands or review steps, input revisions, observed results and
  remaining limitations in repository evidence linked from this card.

  ## Out of scope

  Replacing test runners or storing large logs as authored YAML.

  ## Compatibility and affected components

  This is a design task: proposed YAML and compiled contracts are non-normative until
  implemented. Follow existing human-ID, explicit-import and independently versioned
  component conventions. Human-authored engineering facts use YAML; native code, CAD,
  build and result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Accept the representation and interaction design only when its positive and failure
  examples resolve the stated question. Keep unsupported behavior and unresolved
  engineering judgments explicit. Revise or split scope if it needs an unapproved domain
  model; do not fill gaps with successful-looking fixture values.

