  ## Problem and outcome

  Task cards are authoritative YAML but currently lack the editor assistance available
  for requirements. Reuse work source parsing and value validation for bounded unsaved snapshots without filesystem access. Compare disk and buffer semantics and diagnostics.

  ## Scope and acceptance

  Reuse work source parsing and value validation for bounded unsaved snapshots without filesystem access. Compare disk and buffer semantics and diagnostics.
  Record executable behavioral checks or, for design, a written decision with request
  examples before dependent implementation. Validate error recovery and unchanged source.

  ## Evidence

  Record actual checks and artifacts in completion evidence. Never infer user feedback
  or platform support from local tests.

  ## Dependencies and boundaries

  Follow declared predecessors; the selection decision enables snapshot implementation,
  diagnostics enable navigation, and structural assistance precedes installed dogfooding.
  Reuse the existing work-item language. No imported-target navigation, evidence-file
  checking, work-item formatting, automatic status edits or publication is included.

  ## Compatibility, risks and stop conditions

  Human-authored IDs and YAML remain authoritative; compiled contracts stay unchanged.
  Requests must reject stale results and ambiguous structures. Defer assistance when
  parsing cannot identify a safe token. Preserve existing requirement providers.
  Affected components: editor bridge, work compiler, VS Code providers/tests and guides.

