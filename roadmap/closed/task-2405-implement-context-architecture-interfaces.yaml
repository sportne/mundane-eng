  ## Executed evidence

  Completed on 2026-09-07. Added independently built Java architecture-model and
  source/CLI components, numeric YAML opt-in, compiled provenance/typed imports,
  closed schema and semantic checks, and source-linked Markdown/Mermaid views.
  The shared structure evaluator has only bounded local contract mechanics; it does
  not contain domain record meanings. Source profiles for existing consumers did
  not change. Expanded the draft fixture's aliases and explicitly revised affected
  configuration pins for its bytes and new version metadata.

  make architecture-verify component-boundary-verify gcs-design-verify passed:
  native compile/check/view; a fresh-root identical compiled rebuild; freshness
  edit/rebuild; consumer execution without YAML/source classes; the 13 original
  architecture cases and stricter unsupported-profile cases; all 15 Java groups;
  compiler isolation, requirements-only operations and all existing GCS probes.
  Snapshot changes, tampered imports, stale source navigation and output failures
  are covered. Logs are disposable under build/ci-evidence/gcs-execution/2405.log.
  The single published architecture schema replaces the duplicate draft schema.

  The tool provides engineering analysis, not a wire protocol or vehicle runtime.
  Architecture VS Code integration and expanded distribution remain later cards.
