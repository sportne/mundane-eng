  ## Executed evidence

  Completed on 2026-09-07. Implemented independently built procedure and evidence
  commands with published procedure/run/manual-observation/assessment contracts.
  The bounded event simulator derives ground-state observations from selected
  interface policies, independently of expected criteria. Native run import retains
  raw resource/procedure/subject/runtime/build pins. Manual YAML normalization adds
  converter provenance; separate compiled assessments retain exact run references
  and explicit reviewer claims without establishing approval.

  Implementation refinements add an explicit heartbeat interface, a selected runtime
  resource checked against the executing native adapter, a declared simulator fault
  model, and a 1,000-event limit so produced observations remain within the run bound.
  New-domain reference lookup now belongs to each model owner. Integration review
  also tightened baseline publication capture ordering, bounded existing publication
  comparison, and verified that a competing writer's lock is not deleted.

  The native end-to-end workflow passed actual stale-telemetry and combined mains/link
  simulations, a deliberately defective stale-display model, synthetic manual import,
  separate/disputed/stale assessments, identical fresh-root procedures and raw runs,
  wrong procedure/subject/build/runtime rejection, missing/tampered raw/manual resource
  rejection, changed-procedure staleness, skipped/interrupted/inconclusive outcomes,
  conflicting repeated runs, forged verdict rejection and YAML-free compiled consumers.
  The independent procedure design/schema checks also passed.

  A fresh staged-source export with no copied build outputs passed the entire
  scripts/run-ci-verification.sh wrapper, exit 0: all 18 maintained Java groups,
  compiler-isolation and requirements-only checks, existing native/golden/mutation
  workflows, packages, nine Node tests, actual development and installed VS Code
  hosts, every new GCS native workflow, and both deliberate CI failures with exact
  fixture restoration. The complete output is retained as disposable local evidence
  at build/ci-evidence/gcs-execution/fresh-verify.log. Verified native executables were
  copied back and the four new-domain workflow checks rerun to refresh local reports.
  Final card/index/schema checks cover the subsequent completion metadata changes.

  This is simulation/synthetic evidence, not a deployable GCS, aircraft dynamics model,
  physical hardware test or certified safety determination. Observed criterion support,
  reviewer claims, adequacy and authorization remain separate. Equipment, security,
  assurance, semantic impact, editor and package expansion remain their owning cards.
