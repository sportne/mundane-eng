  ## Executed evidence

  Completed on 2026-09-07. Implemented the published safety YAML/compiled schema,
  independent native compile/check/analyze/query/view commands and source-free
  model component. Queries link actual hazards through controls to selected
  requirements and verification activities; views include source-linked FMEA,
  assumptions, coverage findings and a deterministic qualitative fault-tree diagram.
  Diagram node names are allocated separately from authored IDs to avoid collisions.

  Native workflow verification passed the ten accepted design cases, real selected
  architecture/configuration/requirement/plan imports, stale configuration review,
  identical clean rebuild and consumer execution without YAML/source classes. The
  independent design checker passed. component-boundary-verify passed all 17 Java
  groups and requirements-only operation; the final diagram edit was followed by
  native rebuild and workflow verification. Version-resource and predecessor fixture
  pins were deliberately revised for the newly declared safety domain.

  Missing controls, orphan controls, unverified assumptions and residual risk remain
  visible; no status accepts risk or authorizes deployment. The compiled model
  rejects unsupported probability fields, broken/wrong-kind references, malformed
  or cyclic trees and invalid selected configurations. Full editor, assurance and
  semantic-impact workflows remain owned by their later cards.
