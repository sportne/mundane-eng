  ## Question

  Can engineers trace each reference hazard to its controls and obligations while seeing
  incomplete or obsolete analysis?

  ## Outcome

  Implement Safety Analysis and Control Traceability. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Implement the selected hazard and failure-analysis representations, reference checks and
  derived control coverage views. Populate the example analyses, including explicit
  assumptions and configuration applicability. Surface orphan controls, uncovered
  obligations and unresolved review decisions.

  ## Acceptance evidence

  Reproduce hazard-to-control-to-requirement queries and FMEA/fault-tree views. Inject a
  removed control, broken cause reference, unsupported numeric claim and changed
  applicable configuration; each produces the specified diagnostic or review state. No
  analysis status automatically authorizes deployment. Record commands or review steps,
  input revisions, observed results and remaining limitations in repository evidence
  linked from this card.

  ## Out of scope

  Automated professional safety judgments or acceptance of residual risk.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

