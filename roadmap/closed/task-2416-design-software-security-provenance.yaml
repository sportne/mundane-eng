  ## Executed evidence

  Completed 2026-09-07. The [software decision](../../examples/ground-control-station/design/software.md), draft YAML/schema and independently run native fixture producer select SLSA Provenance v1/in-toto Statement v1 and CycloneDX JSON 1.6 SBOM/VEX. Native identities stay in their standards; project relationships and review applicability remain YAML. Exact upstream schemas, revision/hashes and Apache license are retained for offline fixture verification. SPDX and signature verification boundaries are explicit.

  Ran `build/schema-check-venv/bin/python examples/ground-control-station/design/check-software-design.py`: PASS. A real deterministic source archive build agrees with its unsigned native statement and official-schema-valid BOM/VEX. Changed binary, absent source/recipe and unsupported predicate versions are rejected by the independent probe; authored selection syntax passes its closed schema. Scan states, authority limits, allowlisted producer inputs, offline identity and the future adapter/component boundary are documented. No live vulnerability or authenticated provenance claim is made. The design check is in `make verify`.
