  ## Executed evidence


    ## Executed evidence (2026-09-07)

    Implemented independently versioned assurance-model and source/CLI components,
    [contract](../../specification/0035-assurance-and-review-readiness.md) and
    [native commands](../../distribution/assurance.md). The owned closed schema,
    explicit imports and revision-checked source report retain YAML-free consumers.
    Standard DSSE/Ed25519 verification consumes caller-selected public JWKs. Private
    signing keys exist only in deleted temporary fixture directories.

    Ran make native-assurance native-evidence and
    scripts/check-assurance-workflow.py against actual GCS simulator runs selected
    for BL-SOFTWARE-DEPLOYED. The native report has supported claims with verified
    synthetic adequate reviews and an open field-validation obligation. The separate
    signed-waiver fixture has localReadiness true and authorization none. Retained
    contradictory review, pass/fail runs, missing evidence, changed procedure/case,
    cycles, wrong configuration, expiry boundary, absent keys/signatures, altered
    signed payload, invalid signatures and changed/missing native bytes all produce
    the required blocked states or diagnostics. Clean rebuild of identical selected
    inputs and a JVM consumer without YAML passed. Native evidence was rebuilt for
    the new adapter fingerprint; baseline/tool/manual pins were explicitly revised.

    Added focused PAE byte-length/public-key/time tests and the full-gate target.
    The independent design probe and planning/link checks passed. Generated native
    reports are reproducible under build/gcs-assurance. Authentication is scoped to
    caller-selected keys; real person/role authority, certification, field evidence
    and release approval remain external. No scanner or aircraft is contacted.
