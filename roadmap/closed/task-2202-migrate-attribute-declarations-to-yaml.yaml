body: |
  ## Outcome
  
  Author attribute declarations in YAML across CLI, editor, examples and verification.
  
  ## Work
  
  Implement bounded YAML parsing with token provenance, explicit booleans and duplicate/alias/tag rejection. Convert source fixtures and authoring tests; remove the JSON declaration parser path. Preserve compiled declaration values and snapshot protections.
  
  ## Acceptance evidence
  
  Run maintained JVM groups, declaration schema and public CLI parity checks, editor diagnostics/completion/hover and source mutation checks.
  
  ## Compatibility and affected components
  
  Breaking experimental authoring change authorized by the user. Compiled JSON and JSON import/editor/work manifests remain supported. Source parsers, specs, examples, tests, editor and distribution change where affected.
  
  ## Completion decision
  
  Complete only after the owning checks pass and replaced source representations are removed.
  
  ## References
  
  - [Roadmap](../0001-initial-roadmap.md)

  ## Executed evidence

  All 14 maintained JVM groups pass, including YAML feature rejection, boolean typing, duplicate-key coordinates, source/schema mutation and compiler output failures. Independent declaration/requirement structural schemas pass. Public validator matrix passes with exact JVM/native parity. All nine Node tests and the actual VS Code host pass with the YAML schema fixture, unsaved edits, completion and literal hover. Full regenerated cross-artifact goldens and installed-bundle verification are owned by TC-2204.
