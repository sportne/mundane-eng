  ## Executed evidence

  Completed 2026-09-07. Implemented the [equipment contract](../../specification/0033-equipment-and-connectivity.md) and independent native compile/check/analyze/bom/wiring/view commands. Canonical instance/cable sources generate both BOM quantities and source-linked wiring, preserve selected baseline and allocation, and retain exact datasheet evidence. Selected profiles validate voltage, pin roles/mappings, directions, duplicate input feeds and network-port reuse. Analysis exposes missing required connections, unavailable grounding reference, unprotected supply paths and stale reviewed datasheets.

  Focused Java topology tests and `scripts/check-equipment-workflow.py` passed. The native workflow checks eight incompatible/substitution/installation cases, same-source BOM changes and connection navigation, missing source navigation, changed datasheet rejection, identical clean-root rebuild and YAML-free consumers. Reports are retained under `build/gcs-equipment`. Version resources, predecessor baselines and synthetic manual fixture pins were explicitly updated; the independent configuration workflow also passed. Full combined platform verification follows the remaining budget cards. These checks do not establish ampacity, correct fuse sizing, procurement or electrical safety approval.
