  ## Question

  Can an engineer change equipment or wiring once and obtain checked, consistent derived
  views?

  ## Outcome

  Implement Equipment Selection and Wiring Views. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Implement selected equipment/connectivity contracts, checks and deterministic derived
  BOM/wiring views. Populate the bounded ground hardware assembly and trace source
  evidence for selected ratings; represent installation versus design where needed.

  ## Acceptance evidence

  Change one part or cable and rebuild both views from the same source. Fixtures detect
  the selected incompatible port, missing connection and stale datasheet cases. Navigate
  from a diagram connection to its authored source and from installed instance to baseline
  selection. Record commands or review steps, input revisions, observed results and
  remaining limitations in repository evidence linked from this card.

  ## Out of scope

  A full electrical CAD editor or purchasing integration.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

