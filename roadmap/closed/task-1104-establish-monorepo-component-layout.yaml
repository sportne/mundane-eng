  ## Documentation maintenance

  Replaced orphaned evidence labels with current owning guides. No layout movement
  has been authorized by this documentation update; the condition remains in force.

  ## Planning refinement

  On 2026-09-07, review demonstrated that each native target compiled all Java
  production and test sources despite requirements compiling without other domains.
  The condition is satisfied by that build coupling. The user authorized execution.
  The [component decision](../../distribution/components.md) supplies the concrete
  TC-1101 boundary mapping: explicit component classpaths, focused tests, and only
  the cross-domain editor source/test relocation. This refines the existing scope
  without adding a build-system migration or speculative GCS modules.

  ## Completion evidence

  Completed on 2026-09-07. Eleven explicit source sets enforce production classpaths;
  native targets use focused suites. Only five editor production and three integration
  test files moved, with their Java contents unchanged. The complete gate passed in
  the working checkout and a fresh source export, including native packages and the
  installed editor. Four forbidden-dependency probes and a sources-removed requirements
  build passed. Both CI fault injections failed at the expected targets and restored
  original files. See [execution evidence](../../research/0076-component-layout-verification.md).
  No source/compiled contracts, CLI names or package versions changed.
