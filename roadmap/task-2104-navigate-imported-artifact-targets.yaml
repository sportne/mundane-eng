  ## Problem and outcome

  Work-item relations can name compiled artifacts but editor assistance currently
  stops at local task prerequisites. Navigate work-item relation targets to explicitly mapped requirement/work-item source only when current buffer bytes and structural origins match the compiled revision. Refuse stale or unavailable targets.

  ## Scope and acceptance

  Navigate work-item relation targets to explicitly mapped requirement/work-item source only when current buffer bytes and structural origins match the compiled revision. Refuse stale or unavailable targets.
  Verify scope-qualified identities, unchanged source bytes and refusal to guess
  targets. Implementation uses the preceding decision and existing domain contracts.

  ## Evidence

  Design requires a written contract and worked input before dependent code.
  Implementation requires behavioral fixtures and the owning executable checks.
  Record actual outcomes in completion evidence before closing the card.

  ## Dependencies and work unlocked

  The contract enables validation, structural origins enable navigation, and target
  assistance enables installed workflow verification. Follow declared predecessors.

  ## Non-goals and compatibility

  No new authoring language, artifact identities, implicit builds, network fetching,
  source rewriting, plan/evidence navigation, publication or maturity promise.
  IDs remain human-authored. Compiled formats remain independent of editor versions.

  ## Risks and stop conditions

  Refuse ambiguous scopes, unsupported formats, mismatched pins and unverifiable
  source origins. Missing or modified source must never produce a guessed jump.
  Keep authored facts distinct from compiled revision descriptions. Affected areas:
  editor bridge, work origins, VS Code selection/providers, fixtures and guides.

