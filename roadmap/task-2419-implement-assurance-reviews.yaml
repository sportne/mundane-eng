  ## Question

  Can a reviewer distinguish current support, disagreement, missing evidence and expired
  exceptions for a configuration-specific claim?

  ## Outcome

  Implement Assurance and Review Readiness Queries. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Implement argument/review/waiver contracts and bounded structural/readiness checks.
  Populate a small safety claim with explicit reasoning and unresolved evidence needs, an
  independent review fixture and a time-scoped exception. Preserve human decisions
  separately from derived readiness.

  ## Acceptance evidence

  Report supported, unsupported, disputed, stale and waived states without collapsing them
  into pass. Exercise changed evidence, circular support, missing identity assurance,
  wrong configuration and expired exceptions at an explicit evaluation time. Explain every
  blocked obligation and navigate to its source. Record commands or review steps, input
  revisions, observed results and remaining limitations in repository evidence linked from
  this card.

  ## Out of scope

  Automatic release authorization and professional judgment replacement.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

