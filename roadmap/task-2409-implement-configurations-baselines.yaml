  ## Question

  Can an engineer reproduce and compare selected configurations while reliably detecting
  changed or missing resources?

  ## Outcome

  Implement Reproducible Configuration Baselines. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Implement baseline compilation, explicit selection, pinned resource resolution and
  configuration comparison. Create a simulator baseline and a proposed hardware baseline
  with visibly different applicability; report unavailable resources honestly.

  ## Acceptance evidence

  Rebuild the same baseline in a clean checkout, detect modified content behind an
  unchanged path, reject invalid selections and compare as-designed with as-deployed
  drift. Existing imports remain compatible or receive an explicit independently versioned
  migration. Record commands or review steps, input revisions, observed results and
  remaining limitations in repository evidence linked from this card.

  ## Out of scope

  Automatic live infrastructure discovery and deployment orchestration.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

