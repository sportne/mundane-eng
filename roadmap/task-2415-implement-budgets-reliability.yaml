  ## Question

  Can an engineer reproduce budget results and see when changed inputs exhaust margins or
  invalidate model assumptions?

  ## Outcome

  Implement Budget and Reliability Calculations. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Implement bounded quantity checking and reproducible calculation outputs with input and
  evaluator revisions. Populate ground-station power, UPS, latency, capacity and
  availability examples with labelled assumptions and remaining evidence needs.

  ## Acceptance evidence

  Independent hand calculations or trusted small reference calculations agree within
  stated tolerances. Reject incompatible dimensions, cyclic formulas and missing inputs;
  show margin failure after a server substitution and stale results after an assumption
  change. Reports distinguish estimated and measured values. Record commands or review
  steps, input revisions, observed results and remaining limitations in repository
  evidence linked from this card.

  ## Out of scope

  Optimizing arbitrary symbolic expressions or certifying the hardware design.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

