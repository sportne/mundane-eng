  ## Question

  Can reviewers answer cross-domain engineering questions from derived views with explicit
  provenance and unresolved states?

  ## Outcome

  Deliver Source-Linked Engineering Review Views. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Compose derived context/interface, hazard/control, verification/evidence, BOM/wiring,
  budget and release-readiness views from compiled outputs. Provide scenario and baseline
  filters, unresolved-work lists and source-linked explanations; establish report resource
  handling and reproducibility.

  ## Acceptance evidence

  A reviewer can answer who owns a control, which run supports this build, what a
  substitution invalidates and why release is blocked. CLI and rendered views agree on
  IDs/revisions and unknown states. Remove sources after compilation and show parser-
  independent reports still render with unavailable source navigation identified. Record
  commands or review steps, input revisions, observed results and remaining limitations in
  repository evidence linked from this card.

  ## Out of scope

  A general authored view language; existing conditional view work requires separate
  evidence.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

