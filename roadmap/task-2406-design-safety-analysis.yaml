  ## Question

  How should engineers represent hazards, controls and failure reasoning without confusing
  structural coverage with accepted residual risk?

  ## Outcome

  Design Hazard Control and Failure Analysis Artifacts. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Define hazard records, causes, consequences, operating context, controls, allocated
  requirements and residual-risk decisions. Work through a bounded FMEA and a fault tree
  for loss of trustworthy command/telemetry during mains loss. Define qualitative scales,
  assumptions, common causes, review ownership and evidence obligations; do not turn
  invented probabilities into assurance. Publish draft examples and the
  representation/interaction decision before dependent implementation. If the worked case
  reveals unrelated contracts, split the card before implementation and preserve this
  decision trail.

  ## Acceptance evidence

  Show traceability from hazard through control to verification obligation and a missing-
  control diagnostic. Distinguish a hazard, failure mode, control, test and risk
  acceptance. Examples show shared power as a common cause, stale analysis after interface
  change and an unresolved residual risk. Record commands or review steps, input
  revisions, observed results and remaining limitations in repository evidence linked from
  this card.

  ## Out of scope

  Universal risk scoring, certified assessment methods and treating software failure rates
  as hardware constants.

  ## Compatibility and affected components

  This is a design task: proposed YAML and compiled contracts are non-normative until
  implemented. Follow existing human-ID, explicit-import and independently versioned
  component conventions. Human-authored engineering facts use YAML; native code, CAD,
  build and result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Accept the representation and interaction design only when its positive and failure
  examples resolve the stated question. Keep unsupported behavior and unresolved
  engineering judgments explicit. Revise or split scope if it needs an unapproved domain
  model; do not fill gaps with successful-looking fixture values.

