  ## Question

  The existing tools link individual artifact domains but cannot explain a selected
  cross-artifact change's potential review consequences.

  ## Outcome

  Make impact results inspectable through a disposable report with source-linked explanations.

  ## Work

  Render query output as escaped Markdown; validate embedded compiled inputs and recompute graph and paths before rendering. Display root, affected nodes, path declarations, scope/revision provenance and any traversal truncation.

  ## Acceptance evidence

  Tests reject forged paths and incomplete analysis, verify deterministic rendering and safe text/URLs, and exercise source links plus no-impact and bounded-result cases.

  ## Out of scope

  New source languages, automatic status changes, approval or satisfaction claims,
  source diffs, resource/code-symbol analysis and a universal metamodel.

  ## Compatibility and affected components

  Existing source and compiled contracts remain unchanged. A separate experimental
  impact contract owns integration and output. Likely components are serialized domain
  validation, a new impact consumer, version declarations, CLI tests and documentation.
  Human-authored IDs retain identity; SHA-256 records selected exact revisions only.

  ## Completion decision

  Proceed only when the predecessor contract resolves scope and traversal meaning.
  Stop or revise if a relationship needs inferred domain facts, silently merged
  revisions, unbounded traversal or an unsupported claim about correctness. Each card
  supplies evidence for its own outcome before dependent work starts.

