  ## Question

  How should units, assumptions, uncertainty and model limits be represented so resource
  and reliability calculations remain reviewable?

  ## Outcome

  Design Quantities Budgets and Reliability Analyses. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Define unit-bearing parameters, provenance, uncertainty/ranges, formulas and bounded
  calculation evaluation. Work power/UPS runtime, network/latency, compute/storage budgets
  and an availability/repair model. Separate manufacturer ratings, measured values and
  assumptions; document derating, efficiency, common causes and model validity. Publish
  draft examples and the representation/interaction decision before dependent
  implementation. If the worked case reveals unrelated contracts, split the card before
  implementation and preserve this decision trail.

  ## Acceptance evidence

  A worked hypothetical budget exposes a missing peak load, mixed units and exhausted
  margin. Runtime explicitly accounts for usable energy and conversion assumptions.
  Availability analysis shows sensitivity to repair time and shared power without
  multiplying unjustified independent probabilities. Define stale inputs and applicability
  checks. Record commands or review steps, input revisions, observed results and remaining
  limitations in repository evidence linked from this card.

  ## Out of scope

  A general scientific programming language or unsupported numerical safety claims.

  ## Compatibility and affected components

  This is a design task: proposed YAML and compiled contracts are non-normative until
  implemented. Follow existing human-ID, explicit-import and independently versioned
  component conventions. Human-authored engineering facts use YAML; native code, CAD,
  build and result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Accept the representation and interaction design only when its positive and failure
  examples resolve the stated question. Keep unsupported behavior and unresolved
  engineering judgments explicit. Revise or split scope if it needs an unapproved domain
  model; do not fill gaps with successful-looking fixture values.

