  ## Planning refinement

  TC-1601–1609 introduced a work-item consumer after this card was written. Include
  strict import and typed-link regression coverage for work items referencing
  requirement output 0.2, without introducing attribute-based graph inference or
  adding requirement source-parser dependencies to work-item analysis.
