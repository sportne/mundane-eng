  ## Question

  Can engineers author and navigate the additional artifacts in the installed editor with
  accurate unsaved-state diagnostics?

  ## Outcome

  Extend Editor Authoring for the Reference Artifacts. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Extend explicit project selection and editor bridges for implemented artifact families
  with YAML diagnostics, typed completion, hover, source navigation and safe formatting
  where supported. Use domain schemas and compiled indexes; surface exact-revision versus
  working-copy state and links to derived views.

  ## Acceptance evidence

  Installed-editor scenarios author the worked chain, resolve cross-file references,
  navigate an imported target and edit an unsaved timing/power value. Verify diagnostics
  refresh without stale results, unavailable imports recover and formatting preserves
  content. Publish a per-family capability table with explicit limitations. Record
  commands or review steps, input revisions, observed results and remaining limitations in
  repository evidence linked from this card.

  ## Out of scope

  A new diagram editor or mandatory all-domain installation for requirements authoring.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

