  ## Question

  Which drafts and representations have become obsolete after implementation, and can they
  be removed without losing useful evidence?

  ## Outcome

  Clean Superseded Reference Project Material. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Audit docs, draft representations, generated artifacts and experiment directories after
  the final designs are implemented. Remove superseded authoring formats and redundant
  fixtures; retain decision and verification evidence that still explains maintained
  behavior. Update links, source selections and the supported-artifact inventory.

  ## Acceptance evidence

  Inventory removed/retained material with reasons; current examples use only accepted
  representations and no misleading draft commands. Rebuild generated indexes/reports, run
  planning/link and affected workflow checks, and confirm clean checkout reproduces the
  documented result. Record cleanup evidence before closing. Record commands or review
  steps, input revisions, observed results and remaining limitations in repository
  evidence linked from this card.

  ## Out of scope

  Deleting useful historical evidence or maintained canonical native resources merely to
  reduce file count.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

