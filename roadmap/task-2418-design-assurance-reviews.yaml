  ## Question

  How should claims, evidence adequacy, review identity and exceptions be represented
  without equating editable records with verified authorization?

  ## Outcome

  Design Assurance Arguments Reviews and Waivers. The result is demonstrated against the
  bounded reference project rather than asserted as generic product support.

  ## Work

  Define claims, subclaims, reasoning, evidence links and assessment decisions. Specify
  review subjects and exact revisions, reviewer identity provenance, role/independence
  expectations, waivers with scope/expiry and lifecycle obligations/tailoring. Identify
  which authorization can be checked locally and which requires an external trusted
  service. Publish draft examples and the representation/interaction decision before
  dependent implementation. If the worked case reveals unrelated contracts, split the card
  before implementation and preserve this decision trail.

  ## Acceptance evidence

  Worked support for trustworthy telemetry distinguishes test success from adequate safety
  evidence. Missing evidence, conflicting runs, circular argument, expired waiver and
  changed subject block a positive readiness result. Document tool-confidence obligations
  and limits; an authored reviewer name is not verified authorization. Record commands or
  review steps, input revisions, observed results and remaining limitations in repository
  evidence linked from this card.

  ## Out of scope

  Claiming regulatory compliance or inventing cryptographic trust from editable YAML.

  ## Compatibility and affected components

  This is a design task: proposed YAML and compiled contracts are non-normative until
  implemented. Follow existing human-ID, explicit-import and independently versioned
  component conventions. Human-authored engineering facts use YAML; native code, CAD,
  build and result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Accept the representation and interaction design only when its positive and failure
  examples resolve the stated question. Keep unsupported behavior and unresolved
  engineering judgments explicit. Revise or split scope if it needs an unapproved domain
  model; do not fill gaps with successful-looking fixture values.

