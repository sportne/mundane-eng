  ## Question

  Can another engineer install and reproduce the maintained workflow using only the
  published documentation and packages?

  ## Outcome

  Package and Document the Extended Engineering Workflow. The result is demonstrated
  against the bounded reference project rather than asserted as generic product support.

  ## Work

  Update installation, independent component/version declarations, schemas, migration
  guidance, CI and end-user walkthroughs for maintained additions. Provide one reference
  workflow entry point, per-component commands and an evidence-backed
  supported/unsupported matrix; assess bounded project-size and runtime limits.

  ## Acceptance evidence

  Run owning checks and the authoritative verification gate from a clean checkout,
  including native packaging and installed-editor checks for changed surfaces. A reader
  can reproduce the reference workflow from documented commands. Record coverage limits,
  unresolved domain judgments and external integration requirements. Record commands or
  review steps, input revisions, observed results and remaining limitations in repository
  evidence linked from this card.

  ## Out of scope

  Claiming all UAV products or safety standards are supported by one example.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

