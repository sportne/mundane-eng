  ## Question

  Can an engineer trace a binary or dependency finding to its precise build, configuration
  and project assessment?

  ## Outcome

  Implement Build Provenance and Security Traceability. The result is demonstrated against
  the bounded reference project rather than asserted as generic product support.

  ## Work

  Implement the chosen native build/SBOM/result adapters and the minimum authored security
  records. Demonstrate one pinned software build, one dependency advisory fixture and its
  affected configuration/control chain; make adapters independently replaceable.

  ## Acceptance evidence

  An offline fixture detects a changed binary, missing source revision and unsupported
  input version. Query affected releases for an advisory, record a revision-bound
  assessment and invalidate it after a relevant dependency change. No findings, no scan
  and failed scan remain distinct states. Record commands or review steps, input
  revisions, observed results and remaining limitations in repository evidence linked from
  this card.

  ## Out of scope

  Live vulnerability monitoring and automatic exploitability or risk acceptance.

  ## Compatibility and affected components

  Follow existing human-ID, explicit-import and independently versioned component
  conventions. Human-authored engineering facts use YAML; native code, CAD, build and
  result formats retain their owners through explicit adapters. Identify actual
  source/schema, compiled-format, CLI, editor, report and distribution changes before
  implementation; do not silently widen existing contracts.

  ## Completion decision

  Close only after the stated outcome and acceptance evidence are reproducible. Keep
  unsupported behavior and unresolved engineering judgments explicit. Revise or split
  scope if it needs an unapproved domain model; do not fill gaps with successful-looking
  fixture values.

