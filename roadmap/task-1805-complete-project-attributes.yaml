  ## Outcome

  Offer permitted attribute names and enum values in requirement attribute mappings.

  ## Work and acceptance evidence

  Use the selected declaration and YAML structural context, exclude used keys, quote inserted values and avoid prose/comments or unrelated mappings. Verify required/optional names, partial syntax and declaration changes.

  ## Compatibility and boundaries

  Human-authored source remains authoritative. Requirements and other artifact
  languages keep independent contracts. No work-item authoring integration, remote
  publishing, automated approval or general language-server framework is included.
  Each implemented behavior needs reproducible tests and contributor documentation.

  ## Completion decision

  Stop or revise if the feature requires hidden project discovery, a competing
  semantic validator, stale edits, unsupported source inference or unbounded input.
  The predecessor's contract must resolve dependent implementation choices first.

