format: "mundanereq-yaml-0.4"
attributeSchema: "vaccine-example-metadata"
# Requirements allocated to hosted and presentation components.
requirements:
  - id: "RDS-001"
    attributes:
      layer: "remote"
      owner-team: "Example remote contributors"
    title: "Ingest monitoring records idempotently"
    allocation: "Remote data service"
    statement:
      - prose: "The remote data service shall accept a retransmitted logger file or generated record without creating a second logical observation or event when its equipment identity, record identity, and recorded time equal an already accepted item."
    rationale:
      - "Automatic reconnection and retry must not corrupt trend or alarm counts with duplicates."
    source: "PILOT-CONTEXT:CTX-NETWORK-LOSS"
    decomposes:
      - "SYS-007"
  - id: "RDS-002"
    attributes:
      layer: "remote"
    title: "Retain complete hosted record"
    allocation: "Remote data service"
    statement:
      - prose: "The remote data service shall retain accepted raw observations, logger files, alarm events, fault events, configuration changes, and generated summaries for at least five years after their recorded time."
    rationale:
      - "The hosted service is the durable remote record for the employer's changed service period."
    source: "CR-001 + WHO-EM01.2:4.2.19"
    decomposes:
      - "SYS-009"
      - "SYS-013"
  - id: "RDS-003"
    attributes:
      layer: "remote"
    title: "Authorize users by employer equipment"
    allocation: "Remote data service"
    statement:
      - prose: "The remote data service shall authenticate each user and shall allow data access or administration only for equipment and operations assigned to that user's authorization."
    rationale:
      - "Programme and service roles require different access to potentially sensitive equipment information."
    source: "WHO-EM01.2:4.2.22"
    decomposes:
      - "SYS-010"
  - id: "RDS-004"
    attributes:
      layer: "remote"
    title: "Record administrative changes"
    allocation: "Remote data service"
    statement:
      - prose: "Before applying an administrative change, the remote data service shall record the authenticated user, UTC time, affected configuration item, previous value, and requested new value."
    rationale:
      - "Recording before application preserves an audit fact even if downstream configuration delivery fails."
    source: "PILOT-CONTEXT:Programme administrator concern"
    decomposes:
      - "SYS-013"
  - id: "RDS-005"
    attributes:
      layer: "remote"
    title: "Verify received-file integrity"
    allocation: "Remote data service"
    statement:
      - prose: "The remote data service shall verify the integrity value supplied for each logger file and shall mark the file unavailable for operational use when verification fails."
    rationale:
      - "A corrupted file should remain visible as a fault rather than silently entering the historical record."
    source: "WHO-EM01.2:4.2.10 and 4.2.22"
    decomposes:
      - "SYS-012"
      - "SYS-016"
  - id: "RDS-006"
    attributes:
      layer: "remote"
    title: "Export complete selected interval"
    allocation: "Remote data service"
    statement:
      - prose: "For an authorized export request, the remote data service shall produce a documented machine-readable package containing every retained raw observation, alarm, fault, and summary whose recorded time falls within the selected interval."
    rationale:
      - "A complete export makes employer data portable and independently analyzable."
    source: "WHO-EM01.2:4.2.20-4.2.21"
    decomposes:
      - "SYS-011"
  - id: "RDS-007"
    attributes:
      layer: "remote"
    title: "Protect exported-package integrity"
    allocation: "Remote data service"
    statement:
      - prose: "The remote data service shall provide a SHA-256 digest over each exported package and identify the digest algorithm in the export response."
    rationale:
      - "A recipient can use the digest to detect accidental alteration or truncation after export."
    source: "WHO-EM01.2:4.2.10 and 4.2.22"
    decomposes:
      - "SYS-016"
  - id: "RDS-008"
    attributes:
      layer: "remote"
    title: "Classify expected observation intervals"
    allocation: "Remote data service"
    statement:
      - prose: "For each configured observation interval, the remote data service shall classify its status as received, awaiting delayed communication, unavailable from the logger, or affected by an identified monitoring fault using received records and device-status events."
    rationale:
      - "A durable interval classification supports both browser presentation and historical investigation of missing data."
    source: "PILOT-CONTEXT:CTX-NETWORK-LOSS and CTX-FAULT"
    decomposes:
      - "SYS-012"
  - id: "UI-001"
    attributes:
      layer: "remote"
    title: "Show current and historical state"
    allocation: "Browser interface"
    statement:
      - prose: "The browser interface shall show the latest received temperature, its recorded time and receipt status, active alarms, active faults, and a time-ordered history for equipment authorized to the user."
    rationale:
      - "Presenting value, time, and status together avoids making stale or unavailable data appear current."
    source: "WHO-EM01.2:4.6.8 + PILOT-CONTEXT:Public-health programme monitor concern"
    decomposes:
      - "SYS-003"
      - "SYS-004"
      - "SYS-012"
  - id: "UI-002"
    attributes:
      layer: "remote"
    title: "Label disposition boundary"
    allocation: "Browser interface"
    statement:
      - prose: "The browser interface shall label every excursion display and export as monitoring information that does not determine vaccine disposition."
    rationale:
      - "The system boundary must remain apparent where users interpret excursion data."
    source: "PILOT-CONTEXT:Explicit exclusions"
    decomposes:
      - "SYS-014"
  - id: "NTF-001"
    attributes:
      layer: "remote"
    title: "Submit remote alarm notification"
    allocation: "Notification delivery"
    statement:
      - prose: "Within 15 minutes after the monitoring device detects an alarm, SVEMS notification delivery shall submit a notification containing equipment identity, alarm type, event time, and current status to each configured external recipient endpoint while that endpoint is reachable."
    rationale:
      - "The content and deadline make the remote-awareness obligation observable at the product boundary."
    source: "WHO-EM01.2:4.5.10 and 4.6.5"
    decomposes:
      - "SYS-005"
  - id: "NTF-002"
    attributes:
      layer: "remote"
    title: "Expose notification-delivery outcome"
    allocation: "Notification delivery"
    statement:
      - prose: "SVEMS notification delivery shall record whether each configured external gateway accepted or rejected each notification request and shall expose that outcome to authorized users."
    rationale:
      - "Gateway acceptance is distinguishable from assumed human receipt and makes delivery failure investigable."
    source: "PILOT-CONTEXT:External gateway assumption"
    decomposes:
      - "SYS-005"
      - "SYS-009"
      - "SYS-012"
