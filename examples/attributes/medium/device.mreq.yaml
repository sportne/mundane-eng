format: "mundanereq-yaml-0.4"
attributeSchema: "vaccine-example-metadata"
# Requirements allocated to the external monitoring device.
requirements:
  - id: "DEV-001"
    attributes:
      layer: "device"
      owner-team: "Example device contributors"
    title: "Connect to compliant logger interface"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall obtain logger data and optional operating power through the M2M interfaces defined by WHO/PQS/E006/DL01.3 without requiring a refrigerator-specific adapter."
    rationale:
      - "A standard external EMD is intended to remain compatible across compliant refrigerator brands."
    source: "WHO-EM01.2:4.1.1 and 4.5.3-4.5.7"
    decomposes:
      - "SYS-001"
      - "SYS-008"
  - id: "DEV-002"
    attributes:
      layer: "device"
    title: "Bound each logger mount"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall release a mounted logger USB data interface no later than 180 seconds after initiating the mount."
    rationale:
      - "Prolonged mounting can prevent the logger from recording new data objects."
    source: "WHO-EM01.2:4.2.7"
    decomposes:
      - "SYS-001"
  - id: "DEV-003"
    attributes:
      layer: "device"
    title: "Timestamp logger downloads"
    allocation: "Monitoring device"
    statement:
      - prose: "At each logger download, the monitoring device shall record its synchronized UTC time and associate that time with the logger identity and relative timestamp of the downloaded records."
    rationale:
      - "This association permits the remote service to convert logger-relative timing into absolute event time."
    source: "WHO-EM01.2:4.2.4"
    decomposes:
      - "SYS-002"
  - id: "DEV-004"
    attributes:
      layer: "device"
    title: "Synchronize absolute clock"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall synchronize its UTC clock automatically from the remote service often enough that displayed device time differs from service time by no more than one minute while communication is available."
    rationale:
      - "Automatic synchronization avoids relying on clinic personnel to maintain the absolute clock."
    source: "WHO-EM01.2:4.2.1"
    decomposes:
      - "SYS-002"
  - id: "DEV-005"
    attributes:
      layer: "device"
    title: "Display local time"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall allow an administrator to configure a local time zone and shall display on-site timestamps in that local time zone."
    rationale:
      - "Local staff must be able to relate displayed events to local operating records."
    source: "WHO-EM01.2:4.2.3"
    decomposes:
      - "SYS-002"
      - "SYS-003"
  - id: "DEV-006"
    attributes:
      layer: "device"
    title: "Display required local state"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device display shall show current refrigerator temperature, alarm state, fault state, alarm-monitoring enablement, and estimated remaining device-energy days without use of a separate computing device."
    rationale:
      - "A browser or mobile device may be unavailable during the event that needs local attention."
    source: "WHO-EM01.2:4.2.9 and 4.6.1-4.6.2"
    decomposes:
      - "SYS-003"
  - id: "DEV-007"
    attributes:
      layer: "device"
    title: "Generate local audio-visual alarm"
    allocation: "Monitoring device"
    statement:
      - prose: "Upon detecting a configured alarm condition, the monitoring device shall immediately present an unmistakable visual indication and an intermittent audible indication of at least 70 dB(A) at one metre."
    rationale:
      - "Both modalities increase the chance that an on-site user notices the event."
    source: "WHO-EM01.2:4.6.3"
    decomposes:
      - "SYS-004"
  - id: "DEV-008"
    attributes:
      layer: "device"
    title: "Preserve alarm state when muted"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall let an on-site user mute the audible indication for the current alarm without clearing the visual indication, recorded alarm, or remote alarm state."
    rationale:
      - "Audible muting is a human-factors action, not evidence that the triggering condition ended."
    source: "WHO-EM01.2:4.6.3"
    decomposes:
      - "SYS-003"
      - "SYS-004"
  - id: "DEV-009"
    attributes:
      layer: "device"
    title: "Make disabled monitoring apparent"
    allocation: "Monitoring device"
    statement:
      - prose: "When local alarm monitoring is disabled, the monitoring device shall continuously show the disabled state until monitoring is re-enabled."
    rationale:
      - "A persistent indication reduces the risk that a refrigerator returns to service with alarms unintentionally disabled."
    source: "WHO-EM01.2:4.6.3"
    decomposes:
      - "SYS-003"
      - "SYS-012"
  - id: "DEV-010"
    attributes:
      layer: "device"
    title: "Store interruption backlog"
    allocation: "Monitoring device"
    statement:
      - prose: "While the remote communication path is unavailable, the monitoring device shall retain each acquired logger record and each generated alarm or fault event until the remote service acknowledges receipt."
    rationale:
      - "A local backlog permits reconstruction of the remote history after connectivity returns."
    source: "WHO-EM01.2:4.2.11 + PILOT-CONTEXT:CTX-NETWORK-LOSS"
    decomposes:
      - "SYS-007"
      - "SYS-012"
  - id: "DEV-011"
    attributes:
      layer: "device"
    title: "Reconnect without local intervention"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall automatically reconnect to its configured remote communication path after an interruption and resume transmission of current and retained records."
    rationale:
      - "Recovery should not depend on a clinic user noticing that connectivity has returned."
    source: "WHO-EM01.2:4.5.11"
    decomposes:
      - "SYS-007"
  - id: "DEV-012"
    attributes:
      layer: "device"
    title: "Operate for 240 hours without supplied power"
    allocation: "Monitoring device"
    statement:
      - prose: "Starting with fully charged internal energy storage, the monitoring device shall perform its allocated acquisition, recording, display-on-demand, alarm, and communication functions for at least 240 hours without external power at 43 degrees Celsius."
    rationale:
      - "The environmental condition makes the independence claim testable at the source specification's severe temperature."
    source: "WHO-EM01.2:4.2.12"
    decomposes:
      - "SYS-006"
  - id: "DEV-013"
    attributes:
      layer: "device"
    title: "Report alarm changes during power loss"
    allocation: "Monitoring device"
    statement:
      - prose: "During loss of supplied power, the monitoring device shall detect each alarm condition within 15 minutes and shall immediately attempt remote transmission whenever an alarm or fault state changes."
    rationale:
      - "Energy conservation may reduce routine transmissions but must not hide state transitions."
    source: "WHO-EM01.2:4.2.12"
    decomposes:
      - "SYS-005"
      - "SYS-006"
  - id: "DEV-014"
    attributes:
      layer: "device"
    title: "Limit M2M power draw"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall draw no more than 5 watts from the refrigerator M2M power connection."
    rationale:
      - "Monitoring must not impose an excessive load on the refrigerator power interface."
    source: "WHO-EM01.2:4.5.2"
    decomposes:
      - "SYS-006"
  - id: "DEV-015"
    attributes:
      layer: "device"
    title: "Expose persistent fault codes"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall retain locally accessible codes for EMD and connected-logger faults for at least 60 days after each fault is detected."
    rationale:
      - "Persistent codes permit a technician to diagnose an intermittent or previously cleared fault."
    source: "WHO-EM01.2:4.2.9"
    decomposes:
      - "SYS-015"
  - id: "DEV-016"
    attributes:
      layer: "device"
    title: "Permit field energy-storage replacement"
    allocation: "Monitoring device"
    statement:
      - prose: "A trained technician shall be able to replace each designated replaceable energy-storage component on site without recalibrating the refrigerator logger sensors."
    rationale:
      - "Energy-storage service should not create unrelated calibration work or require product return."
    source: "WHO-EM01.2:4.2.13"
    decomposes:
      - "SYS-015"
  - id: "DEV-017"
    attributes:
      layer: "device"
    title: "Protect external enclosure"
    allocation: "Monitoring device"
    statement:
      - prose: "The installed monitoring-device enclosure shall provide at least IP64 protection as defined by IEC 60529."
    rationale:
      - "The selected device is externally mounted in a potentially dusty, humid clinic environment."
    source: "WHO-EM01.2:4.3.4"
    decomposes:
      - "SYS-006"
      - "SYS-015"
  - id: "DEV-018"
    attributes:
      layer: "device"
    title: "Transmit logger files without modification"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall transmit each downloaded logger file to the remote data service without modifying the file contents."
    rationale:
      - "Preserving the source bytes avoids device-specific reinterpretation before remote ingestion and integrity checking."
    source: "WHO-EM01.2:4.2.4"
    decomposes:
      - "SYS-008"
      - "SYS-016"
  - id: "DEV-019"
    attributes:
      layer: "device"
    title: "Supply transferred-file integrity value"
    allocation: "Monitoring device"
    statement:
      - prose: "The monitoring device shall calculate and transmit a SHA-256 digest for each downloaded logger file before transmitting that file to the remote data service."
    rationale:
      - "The remote service needs a value established before transfer in order to detect transfer corruption."
    source: "WHO-EM01.2:4.2.10"
    decomposes:
      - "SYS-016"
