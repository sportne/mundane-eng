format: "mundanereq-yaml-0.4"
attributeSchema: "vaccine-example-metadata"
# System requirements allocate externally observable SVEMS behavior.
requirements:
  - id: "SYS-001"
    attributes:
      layer: "system"
      owner-team: "Example system contributors"
    title: "Acquire logger observations"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall acquire each available time-based refrigerator data object from the connected logger at least once every 15 minutes."
    rationale:
      - "The system cannot display, alarm on, or transmit observations that it has not acquired within the source recording interval."
    source: "WHO-EM01.2:4.2.6"
    decomposes:
      - "NEED-001"
      - "NEED-004"
  - id: "SYS-002"
    attributes:
      layer: "system"
    title: "Establish absolute event time"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall associate each downloaded logger record with UTC derived from an independently synchronized clock whose displayed time differs from server time by no more than one minute while synchronization is available."
    rationale:
      - "The logger supplies relative time, so SVEMS must establish the absolute-time association used remotely."
    source: "WHO-EM01.2:4.2.1 and 4.2.4"
    decomposes:
      - "NEED-008"
  - id: "SYS-003"
    attributes:
      layer: "system"
    title: "Present local monitoring state"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall present current refrigerator temperature, active alarm state, active fault state, monitoring-enabled state, and EMD energy remaining at the storage site."
    rationale:
      - "These values let clinic personnel distinguish normal operation, excursions, faults, and intentionally disabled alarming."
    source: "WHO-EM01.2:4.2.9 and 4.6.1-4.6.3"
    decomposes:
      - "NEED-001"
      - "NEED-009"
  - id: "SYS-004"
    attributes:
      layer: "system"
    title: "Annunciate local alarm conditions"
    allocation: "SVEMS"
    statement:
      - prose: "When SVEMS detects a configured alarm condition, it shall immediately activate a locally apparent visual alarm and a 70 dB(A) or greater audible alarm measured at one metre."
    rationale:
      - "An on-site alarm must be apparent without requiring a browser or remote network."
    source: "WHO-EM01.2:4.6.3"
    decomposes:
      - "NEED-001"
  - id: "SYS-005"
    attributes:
      layer: "system"
    title: "Communicate remote alarm conditions"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall make a detected alarm condition known to configured remote recipients no later than 15 minutes after the alarm condition begins while an external communication path is available."
    rationale:
      - "The delay bound connects local event detection to useful remote oversight while acknowledging an external network dependency."
    source: "WHO-EM01.2:4.5.10"
    decomposes:
      - "NEED-002"
  - id: "SYS-006"
    attributes:
      layer: "system"
    title: "Continue essential operation without supply power"
    allocation: "SVEMS"
    statement:
      - prose: "Following loss of refrigerator-supplied power, SVEMS shall continue data acquisition, recording, local alarm detection, local alarm annunciation, and alarm-status communication for at least 240 hours."
    rationale:
      - "The selected external EMD must remain useful through long refrigerator holdover periods."
    source: "WHO-EM01.2:4.2.12"
    decomposes:
      - "NEED-003"
  - id: "SYS-007"
    attributes:
      layer: "system"
    title: "Recover from communication interruption"
    allocation: "SVEMS"
    statement:
      - prose: "After restoration of its configured remote communication path, SVEMS shall reconnect automatically and transmit records accumulated during the interruption without duplicating or discarding an accumulated record."
    rationale:
      - "Local monitoring continuity is insufficient if the remote historical record remains permanently incomplete after connectivity returns."
    source: "WHO-EM01.2:4.5.11 + PILOT-CONTEXT:CTX-NETWORK-LOSS"
    decomposes:
      - "NEED-003"
      - "NEED-004"
      - "NEED-009"
  - id: "SYS-008"
    attributes:
      layer: "system"
    title: "Preserve standardized cold-chain data"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall represent acquired and generated cold-chain data objects in the format defined by WHO/PQS/E006/DS01.2 and shall preserve downloaded logger files unmodified when transmitting them to the remote data service."
    rationale:
      - "Standardized and unmodified data supports interoperability and independent downstream interpretation."
    source: "WHO-EM01.2:4.2.4-4.2.5"
    decomposes:
      - "NEED-006"
  - id: "SYS-009"
    attributes:
      layer: "system"
    title: "Retain hosted monitoring records"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall make raw observations, alarms, faults, and derived summaries available to authorized employer users for at least five years after their recorded time."
    rationale:
      - "The employer's changed service period supports a longer programme audit and investigation horizon."
    source: "CR-001 + WHO-EM01.2:4.2.19"
    decomposes:
      - "NEED-004"
      - "NEED-005"
  - id: "SYS-010"
    attributes:
      layer: "system"
    title: "Enforce authorized remote access"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall restrict remote monitoring data and administrative operations to authenticated users authorized for the applicable employer equipment."
    rationale:
      - "Hosted monitoring should not expose clinic or equipment information to unrelated users."
    source: "WHO-EM01.2:4.2.22"
    decomposes:
      - "NEED-005"
  - id: "SYS-011"
    attributes:
      layer: "system"
    title: "Deliver employer data externally"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall allow an authorized employer user to export all raw observations, alarms, faults, and summaries for a selected time interval in a documented machine-readable form."
    rationale:
      - "Data ownership is operationally meaningful only if the employer can retrieve and use its information outside the hosted interface."
    source: "WHO-EM01.2:4.2.20-4.2.21"
    decomposes:
      - "NEED-005"
      - "NEED-006"
  - id: "SYS-012"
    attributes:
      layer: "system"
    title: "Expose monitoring-data status"
    allocation: "SVEMS"
    statement:
      - prose: "For each expected observation interval, SVEMS shall distinguish a received observation, an interval awaiting communication, an unavailable logger observation, and an identified monitoring fault."
    rationale:
      - "Explicit status prevents a missing reading from being interpreted as an in-range reading."
    source: "CDC-PINK-5:Monitoring Vaccine Temperatures + PILOT-CONTEXT:CTX-FAULT"
    decomposes:
      - "NEED-009"
  - id: "SYS-013"
    attributes:
      layer: "system"
    title: "Record configuration changes"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall record the time, authenticated actor, previous value, and new value for changes to equipment identity, time zone, alarm thresholds, alarm enablement, recipient assignments, and user authorization."
    rationale:
      - "Investigation must distinguish equipment behavior from changes in the configuration used to interpret or communicate it."
    source: "PILOT-CONTEXT:Programme administrator concern"
    decomposes:
      - "NEED-004"
      - "NEED-005"
  - id: "SYS-014"
    attributes:
      layer: "system"
    title: "Avoid automated vaccine-disposition decisions"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall not classify monitored vaccines as acceptable, unusable, or releasable and shall label excursion information as input to the employer's response process."
    rationale:
      - "The monitoring product lacks the product, exposure, and programme authority needed to make a disposition decision."
    source: "CDC-PINK-5:Temperature Excursions + PILOT-CONTEXT:Explicit exclusions"
    decomposes:
      - "NEED-010"
  - id: "SYS-015"
    attributes:
      layer: "system"
    title: "Support field fault diagnosis"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall provide a trained technician with persistent diagnostic codes for EMD, logger-interface, power, and remote-communication faults."
    rationale:
      - "Distinct persistent codes support restoration of monitoring without requiring the technician to infer the failed boundary."
    source: "WHO-EM01.2:4.2.9 and 4.9.1"
    decomposes:
      - "NEED-007"
      - "NEED-009"
  - id: "SYS-016"
    attributes:
      layer: "system"
    title: "Protect monitoring-record integrity"
    allocation: "SVEMS"
    statement:
      - prose: "SVEMS shall detect accidental alteration or truncation of each transferred logger file and each exported monitoring-data package."
    rationale:
      - "Undetected transfer or export corruption could make an historical record misleading."
    source: "WHO-EM01.2:4.2.10 and 4.2.22"
    decomposes:
      - "NEED-004"
      - "NEED-006"
