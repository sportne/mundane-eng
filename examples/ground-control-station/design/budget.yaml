    repair: POWER-REPAIR
  explanation: 'Conditional series/repair model: independent residual device failures assumed; one shared power cause included once. No common-cause independence evidence.'
limitations:
- Synthetic design estimates; no numerical safety or certified availability claim.
- Storage uses decimal bytes; no compression benefit; compute fractions share one declared workload capacity basis.
- MTBF/repair steady-state model excludes transient recovery, maintenance scheduling and unmodelled common causes.
