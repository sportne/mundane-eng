format: mundane-safety-yaml-0.1
id: SAFETY-GCS
context:
  description: Simulation-only ground supervision under stale state and combined
    mains/link loss
  configuration:
    scope: gcs-config
    kind: baseline
    id: BL-SIM-DESIGN
  modes:
  - scope: gcs-arch
    kind: mode
    id: MONITORING
severityScale:
- id: minor
  meaning: Recoverable loss of a non-command aid
- id: major
  meaning: Loss of trustworthy supervision or command outcome
- id: catastrophic
  meaning: Potential loss of aircraft or harm; requires separate operational 
    assessment
assumptions:
- id: ASM-SIM
  text: Synthetic autopilot and clocks; no actual power independence or aircraft
    failsafe evidence
  owner: systems
  state: unverified
causes:
- id: CAUSE-DELAY
  description: Delayed telemetry despite live heartbeat
  commonCauseGroup:
- id: CAUSE-POWER
  description: Shared mains supply affects host and network equipment
  commonCauseGroup: POWER-DOMAIN
- id: CAUSE-ACK
  description: Acknowledgement lost or delivered after timeout
  commonCauseGroup:
hazards:
- id: HZ-STALE
  title: Operator trusts stale telemetry
  causes:
  - scope: self
    kind: cause
    id: CAUSE-DELAY
  - scope: self
    kind: cause
    id: CAUSE-POWER
  consequence: Unsafe new intent based on unknown aircraft state
  severity: major
  controls:
  - scope: self
    kind: control
    id: CTRL-FRESH
  assumptions:
  - scope: self
    kind: assumption
    id: ASM-SIM
  residualRisk:
    state: unresolved
    owner: safety
    reason: Simulation does not establish field thresholds or operational 
      adequacy.
- id: HZ-COMMAND
  title: Ambiguous command during combined mains and link loss
  causes:
  - scope: self
    kind: cause
    id: CAUSE-POWER
  - scope: self
    kind: cause
    id: CAUSE-ACK
  consequence: Ground status misrepresents execution or intent is replayed after
    reconnect
  severity: major
  controls:
  - scope: self
    kind: control
    id: CTRL-ACK
  - scope: self
    kind: control
    id: CTRL-POWER
  assumptions:
  - scope: self
    kind: assumption
    id: ASM-SIM
  residualRisk:
    state: review-required
    owner: safety
    reason: UPS independence and aircraft-local failsafe remain unqualified.
controls:
- id: CTRL-FRESH
  description: Bound freshness and trusted time; inhibit new intent on stale or 
    unknown state
  hazards:
  - scope: self
    kind: hazard
    id: HZ-STALE
  requirements:
